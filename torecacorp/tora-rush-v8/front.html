<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>v8 フロント：オリパ一覧 → TORAMI RUSH（モック）</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbf7ef;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;color:#1f2937}
.app{max-width:572px;margin:0 auto;background:#fff;min-height:100vh;padding-bottom:70px;position:relative}
.hd{display:flex;align-items:center;gap:8px;padding:8px 12px;height:58px}
.logo{font:900 22px/1 system-ui;color:#f59e0b;letter-spacing:.02em;text-shadow:1px 1px 0 #7c2d12}
.coin{margin-left:auto;background:#f3f4f6;border-radius:999px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;gap:5px;align-items:center}
.ci{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fde68a,#d97706);display:inline-block;flex:none}
.plus{color:#dc2626;font-weight:900}.ib{width:34px;height:34px;border-radius:50%;background:#e5e7eb;flex:none}
.tabs{display:flex;align-items:center;gap:2px;padding:0 10px;border-bottom:1px solid #f1f1f1}
.tabs a{padding:10px 12px;font-size:13px;color:#6b7280;cursor:pointer;border-bottom:2px solid transparent}.tabs a.on{color:#111;font-weight:700;border-color:#f59e0b}
.tabs select{margin-left:auto;font-size:12px;border:1px solid #e5e7eb;border-radius:6px;padding:6px 8px;background:#fff}
.bn{margin:8px 10px;height:150px;border-radius:8px;background:linear-gradient(120deg,#7c2d12,#f59e0b 55%,#fde68a);display:flex;align-items:center;justify-content:center;color:#fff;font:900 26px/1.1 system-ui;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px}
.card{display:block;border:1px solid #eee;border-radius:8px;overflow:hidden;background:#fff;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer}
.th{aspect-ratio:3/2;position:relative;overflow:hidden;background:#e5e7eb}
.dummy{background:linear-gradient(135deg,#d1d5db,#f3f4f6);display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:12px;font-weight:700}
.ret{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.55);color:#fde047;font:900 11px/1.2 system-ui;padding:2px 5px;border-radius:3px}
.ft{display:flex;align-items:center;gap:6px;padding:8px 9px}.pr{font-weight:800;font-size:17px;display:flex;gap:4px;align-items:center;white-space:nowrap}.pr small{font-size:11px;color:#6b7280;font-weight:500}
.rm{margin-left:auto;font-size:10.5px;color:#374151;text-align:right;min-width:42%}.rm b{font-size:11.5px}.gb{height:5px;background:#e5e7eb;border-radius:3px;margin-top:3px}.gb i{display:block;height:100%;background:#16a34a;border-radius:3px}
/* RUSHカード */
.rush .th{background:#0b0d18 url(art/sanctuary.webp) center/cover}
.rush .tor{position:absolute;right:-6%;bottom:0;height:100%;width:auto;opacity:.9;-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%);mask-image:linear-gradient(90deg,transparent,#000 35%)}
.rush .ttl{position:absolute;left:5%;top:50%;transform:translateY(-55%);width:62%;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.rush .nm{position:absolute;left:6px;bottom:6px;right:6px;color:#fff;font-weight:800;font-size:11.5px;text-shadow:0 1px 3px #000}
.tag{position:absolute;left:4px;top:4px;display:flex;gap:4px}.tag span{font:900 10px/1 system-ui;padding:3px 5px;border-radius:3px;background:#dc2626;color:#fff}.tag span.g{background:linear-gradient(90deg,#b45309,#facc15);color:#1f1300}
.chip{font-size:10.5px;font-weight:700;color:#7c3aed;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:999px;padding:2px 7px;white-space:nowrap}
.rush .ft{flex-wrap:wrap;row-gap:4px}.rush .rm{margin-left:auto;min-width:0}@media(max-width:480px){.rush .pr{font-size:15px}.rush .rm{margin-left:0;width:100%;text-align:left}}
.rush.gold .th{background-image:linear-gradient(rgba(120,80,0,.35),rgba(0,0,0,.2)),url(art/sanctuary.webp)}
.bot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:572px;background:#fff;border-top:1px solid #eee;display:grid;grid-template-columns:repeat(4,1fr);height:58px;z-index:5}
.bot a{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#374151;gap:3px}.bot a.on{color:#d97706;font-weight:700}.bot i{width:20px;height:18px;border:2px solid currentColor;border-radius:4px}
.memo{max-width:572px;margin:0 auto 8px;font-size:11.5px;background:#faf5ff;border:1px dashed #a78bfa;border-radius:6px;padding:7px 10px;color:#4c1d95}.memo a{color:#6d28d9}
.empty{grid-column:1/-1;text-align:center;font-size:12px;color:#9ca3af;padding:30px 0}
</style></head><body>
<div class="memo"><b>v8 フロントのモック</b>：今のサイトと同じオリパ一覧に、管理画面で作った<b>公開中のRUSHオリパ</b>がカードで並びます。タップでRUSHのプレイ待機画面へ。<a href="admin.html" target="_blank">管理画面モック</a>で作る・公開を切り替えると、ここに反映されます。</div>
<div class="app">
 <div class="hd"><span class="logo">TORA</span><span class="coin"><span class="ci"></span>1,000,000 <span class="plus">⊕</span></span><span class="ib"></span><span class="ib"></span></div>
 <div class="tabs" id="tabs"><a class="on" data-c="ポケモン">ポケモン</a><a data-c="遊戯王">遊戯王</a><a data-c="ホビー">ホビー</a><select><option>オススメ順</option><option>新着順</option><option>価格が安い順</option><option>価格が高い順</option></select></div>
 <div class="bn">バナー</div>
 <div class="grid" id="grid"></div>
</div>
<nav class="bot"><a class="on"><i></i>オリパガチャ</a><a><i></i>獲得景品</a><a><i></i>ガチャ履歴</a><a><i></i>マイページ</a></nav>
<script src="state.js"></script>
<script>
const fmt=v=>Math.round(v).toLocaleString(),man=v=>v>=10000?(v/10000).toLocaleString()+"万":fmt(v);
const DUMMY=[{c:"ポケモン",p:574,rest:10000,n:10000,ret:"105%"},{c:"ポケモン",p:1200,rest:176,n:310,ret:"110%"},{c:"ポケモン",p:500,rest:820,n:1000},{c:"ポケモン",p:3000,rest:41,n:200},{c:"遊戯王",p:1000,rest:300,n:500},{c:"ホビー",p:800,rest:90,n:150}];
let CAT="ポケモン";
function rushCard(g){const r=g.rates.slice().sort((a,b)=>a-b);const price=g.charge?"0":r.length===1?fmt(r[0]):`${man(r[0])}〜${man(r[r.length-1])}`;
 return`<a class="card rush ${g.charge?"gold":""}" href="index.html?id=${g.id}${g.charge?"&g=gold":""}#play"><div class="th"><img class="tor" src="art/torami.webp" alt=""><img class="ttl" src="art/title.webp" alt="TORAMI RUSH"><div class="tag"><span>RUSH</span>${g.charge?'<span class="g">チャージ限定</span>':""}</div><div class="nm">${g.name}</div></div>
 <div class="ft"><span class="pr"><span class="ci"></span>${price}<small>/1回</small></span><span class="rm">${g.charge?'<span class="chip">挑戦枠で遊べる</span>':`<span class="chip">${r.length}レートから選べる</span>`}</span></div></a>`}
function dummyCard(d){return`<a class="card"><div class="th dummy">通常オリパ（既存）${d.ret?`<span class="ret">総還元率<br>${d.ret}</span>`:""}</div><div class="ft"><span class="pr"><span class="ci"></span>${fmt(d.p)}<small>/1回</small></span><span class="rm">残り <b>${fmt(d.rest)}</b> / ${fmt(d.n)}<div class="gb"><i style="width:${d.rest/d.n*100}%"></i></div></span></div></a>`}
function render(){const S=RS.load();const rush=CAT==="ポケモン"?S.gachas.filter(g=>g.pub!==false&&g.rates.length):[];const dm=DUMMY.filter(d=>d.c===CAT);
 // 並び：通常オリパの間にRUSHが入る（2番目から）
 const cards=dm.map(dummyCard);cards.splice(Math.min(1,cards.length),0,...rush.map(rushCard));
 document.getElementById("grid").innerHTML=cards.join("")||'<div class="empty">オリパがありません</div>'}
document.getElementById("tabs").addEventListener("click",e=>{const a=e.target.closest("a[data-c]");if(!a)return;CAT=a.dataset.c;document.querySelectorAll("#tabs a").forEach(x=>x.classList.toggle("on",x===a));render()});
addEventListener("storage",e=>{if(e.key===RS.LS)render()});
render();
</script></body></html>
