<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TORAMI RUSH 管理画面モック（tora-oripa console 組み込み案）</title>
<style>
:root{--tx:#1a202c;--mut:#718096;--sub:#4a5568;--line:#e2e8f0;--bg:#f7fafc;--blue:#3182ce;--blue2:#2b6cb0;--green:#38a169;--red:#e53e3e;--ora:#dd6b20;--new:#805ad5}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"system-ui","Segoe UI",Helvetica,Arial,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--tx);background:var(--bg);font-size:14px}
.top{position:fixed;left:0;right:0;top:0;height:39px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;z-index:5}
.logo{width:184px;white-space:nowrap;padding-left:10px;font-weight:700;font-size:11.5px;display:flex;gap:5px;align-items:center}
.logo i{width:14px;height:14px;border-radius:3px;background:var(--blue);display:inline-block}
.top .user{margin-left:auto;padding-right:12px;font-weight:600;font-size:12.5px}
.side{position:fixed;top:39px;bottom:0;left:0;width:184px;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:8px 0;font-size:12px}
.side a{display:block;overflow:hidden;text-overflow:ellipsis;padding:7px 12px;color:var(--tx);text-decoration:none;cursor:pointer;white-space:nowrap}
.side a.sub{padding-left:22px;font-size:11.5px}.side a.act{background:#ebf8ff;border-right:3px solid var(--blue);color:var(--blue2)}
.side .grp{padding:7px 12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;white-space:nowrap}
.side .rush{border-top:1px dashed #d6bcfa;border-bottom:1px dashed #d6bcfa;background:#faf5ff;margin:4px 0;padding-bottom:4px}
.side .rush .grp{color:var(--new)}
.nb{font-size:9px;line-height:14px;background:var(--new);color:#fff;border-radius:3px;padding:0 4px;margin-left:6px;flex:none}
main{margin:39px 0 0 184px;padding:12px}
.panel{background:#fff;border-radius:6px;padding:12px 10px 40px;min-height:calc(100vh - 64px)}
.bc{font-size:11.5px;color:var(--sub);margin-bottom:6px}.bc span{margin:0 4px}
h1{font-size:21px;margin:0 0 14px;display:flex;align-items:center;gap:8px}h1 .bk{font-size:18px;color:var(--sub)}
h2{font-size:16px;margin:26px 0 4px}h3{font-size:13.5px;margin:16px 0 6px}
.desc{font-size:11.5px;color:var(--sub);margin:0 0 8px}.hint{font-size:11px;color:var(--mut)}
label.l{display:block;font-size:13px;margin:14px 0 4px}
input,select,textarea{font:inherit;font-size:14px;color:var(--tx);border:1px solid var(--line);border-radius:6px;height:34px;padding:0 12px;background:#fff;width:100%}
textarea{height:auto;padding:8px 12px}
input.s,select.s{width:auto;min-width:90px;height:30px;font-size:13px;padding:0 8px}
.btn{font:inherit;font-weight:600;font-size:13.5px;border:0;border-radius:6px;height:34px;padding:0 14px;cursor:pointer;color:#fff;background:var(--green)}
.btn.blue{background:var(--blue)}.btn.gray{background:#edf2f7;color:var(--tx)}.btn.sm{height:28px;font-size:12px;padding:0 10px}.btn:disabled{opacity:.45;cursor:not-allowed}
table{border-collapse:collapse;width:100%}th{font-size:11px;font-weight:700;color:var(--sub);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}td.n,th.n{text-align:right}
.sw{width:30px;height:16px;border-radius:8px;background:#cbd5e0;position:relative;display:inline-block;vertical-align:middle;cursor:pointer}.sw:after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--blue)}.sw.on:after{left:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
.alert{border-radius:6px;padding:10px 12px;font-size:12.5px;margin:8px 0}.alert.g{background:#f0fff4;border:1px solid #9ae6b4}.alert.o{background:#fffaf0;border:1px solid #fbd38d;color:#7b341e;font-weight:600}.alert.p{background:#faf5ff;border:1px solid #d6bcfa}
.new{outline:2px dashed var(--new);outline-offset:6px;border-radius:4px;position:relative;margin:22px 0 14px}
.new>.tag{position:absolute;top:-17px;left:-2px;background:var(--new);color:#fff;font-size:10px;font-weight:700;border-radius:3px;padding:1px 5px}
.hide{opacity:.35;position:relative}.hide>.tag{position:absolute;top:-2px;right:0;background:#a0aec0;color:#fff;font-size:10px;font-weight:700;border-radius:3px;padding:1px 5px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:3px;padding:1px 6px;background:#c6f6d5;color:#22543d}.badge.p{background:#e9d8fd;color:#44337a}.badge.o{background:#feebc8;color:#7b341e}.badge.r{background:#fed7d7;color:#822727}.badge.g{background:#edf2f7;color:#4a5568}
.ok{color:var(--green);font-weight:700}.ng{color:var(--red);font-weight:700}.warn{color:var(--ora);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.rates{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:6px 14px}
.rates label{display:flex;gap:6px;align-items:center;font-size:13px}.rates input{width:auto;height:auto}
.bar{height:5px;background:#edf2f7;border-radius:3px;margin-top:3px;min-width:90px}.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.note-box{background:#fffff0;border:1px solid #faf089;border-radius:6px;padding:10px 12px;font-size:12px;margin:10px 0}
.ac{position:relative}.acl{position:absolute;top:34px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.08);z-index:3;font-size:12.5px}
.acl div{padding:6px 10px;cursor:pointer}.acl div:hover{background:#ebf8ff}
.legend{position:fixed;right:12px;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;box-shadow:0 2px 8px rgba(0,0,0,.08);z-index:6;max-width:300px}
.legend b{color:var(--new)}
.thumb{width:54px;height:34px;border-radius:3px;background:linear-gradient(135deg,#bee3f8,#e9d8fd);display:inline-block}
</style></head><body>
<div class="top"><div class="logo"><i></i>tora-oripa console</div><div class="user">test@torecacorp.jp</div></div>
<nav class="side" id="side">
 <div class="grp">オリパ <span>⌃</span></div>
 <a class="sub" data-p="list">一覧</a><a class="sub">カテゴリー</a>
 <a>カードデータベース</a><a>配送</a><a>イベント</a><a>宝箱</a><a>課金アイテム</a><a>ポイント利用ログ</a><a>決済ログ</a><a>ユーザー</a><a>お知らせ</a><a>バナー</a><a>ガチャ演出</a>
 <div class="rush"><div class="grp">TORAMI RUSH<span class="nb">NEW</span></div>
  <a class="sub" data-p="tables">倍率の表・レート帯</a><a class="sub" data-p="psa">PSA景品マスタ</a><a class="sub" data-p="monitor">BOXモニター</a><a class="sub" data-p="hist">当選履歴</a><a class="sub" data-p="scn">シナリオ</a><a class="sub" data-p="disp">表示設定</a></div>
 <a>友達招待報酬</a><a>ユーザーランク</a><a>クーポン</a><a>アフィリコード</a><a>メンテナンスモード</a><a>設定</a>
</nav>
<main><div class="panel" id="pg"></div></main>
<div class="legend" id="lg"><a onclick="this.parentNode.style.display='none'" style="float:right;cursor:pointer;color:#718096;margin-left:6px">✕</a><b>紫の点線</b>＝今回追加する部分／<span style="color:#a0aec0;font-weight:700">グレー</span>＝RUSHのときは使わない既存項目。<br>ここで作った・変えたRUSHガチャは、オリパ一覧の<b>「プロトで遊ぶ」</b>でそのまま遊べます（設定とBOXはこのブラウザに保存）。<a href="./">プロトv6</a>／<a href="manual.html">説明書</a></div>
<style>.toast{position:fixed;top:48px;left:50%;transform:translateX(-50%);background:#2f855a;color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:600;z-index:20;box-shadow:0 4px 12px rgba(0,0,0,.15)}.toast a{color:#fff;text-decoration:underline;margin-left:8px}.btn.pur{background:#805ad5}</style>
<script src="state.js"></script>
<script>
const $=id=>document.getElementById(id);const fmt=v=>Math.round(v).toLocaleString();const man=v=>v>=10000?(v/10000).toLocaleString()+"万":fmt(v);const mt=m=>"×"+(Math.round(m*10)/10);
const ALLR=RS.ALLR;let S=RS.load();
function save(msg,play){RS.save(S);if(msg)toast(msg,play)}
function toast(msg,gid){const t=document.createElement("div");t.className="toast";t.innerHTML=msg+(gid?`<a href="index.html?g=${gid}#play" target="_blank">プロトで遊ぶ →</a>`:"");document.body.appendChild(t);setTimeout(()=>t.remove(),gid?4500:2200)}
const TK=["t1000","t100","t50"];
const rowsOf=k=>S.tables[k];
function st(rows){const N=rows.reduce((a,b)=>a+b[1],0),Sm=rows.reduce((a,b)=>a+b[0]*b[1],0),on=rows.filter(x=>x[1]>0).map(x=>x[0]);return{N,ret:N?Sm/N:0,w7:N?rows.filter(x=>x[0]>=1).reduce((a,b)=>a+b[1],0)/N:0,max:Math.max(...on),min:Math.min(...on),ceil:rows.reduce((a,b)=>a+Math.max(0,b[0]-1)*b[1],0),step:rows.every(([m,c])=>!c||Math.abs(m*10-Math.round(m*10))<1e-9)}}
const tname=k=>{const s=st(rowsOf(k));return fmt(s.N)+"口・最大"+mt(s.max)};
const bandMax=b=>b.max==null?Infinity:b.max;
const tk=r=>S.bands.find(b=>r<=bandMax(b)).t;
const G=id=>S.gachas.find(g=>String(g.id)===String(id));
function combos(pt,g){const o=[];ALLR.filter(r=>g.sell.includes(r)).forEach(r=>rowsOf(tk(r)).forEach(([m,c])=>{if(Math.abs(m*r-pt)<1e-6)o.push({r,m,c,N:st(rowsOf(tk(r))).N})}));return o}
const CARDS=["リザードン SAR","リザードン ex SAR","ピカチュウ SAR","マリオピカチュウ","ミュウ AR","ゲンガー SR","リーリエ SR","ビクティニ","ブラッキー SAR","ニンフィア AR","イーブイ SAR","ルギア V SA"];
const sw=on=>`<span class="sw ${on?"on":""}"></span>`;
const NEWB=(t,h)=>`<div class="new"><span class="tag">${t}</span>${h}</div>`;
const HIDE=h=>`<div class="hide"><span class="tag">RUSHでは非表示</span>${h}</div>`;
const playBtn=(id,sm)=>`<a class="btn pur ${sm?"sm":""}" style="display:inline-flex;align-items:center;text-decoration:none" href="index.html?g=${id}#play" target="_blank">▶ プロトで遊ぶ</a>`;
/* ---------- オリパ一覧 ---------- */
function pList(){return`<div class="bc">オリパ<span>/</span>一覧</div><div class="row" style="justify-content:space-between"><h1 style="margin:0">オリパ一覧</h1><div><button class="btn blue" id="newRush">＋ 新規作成（TORAMI RUSH）</button> <button class="btn blue">表示順の変更</button></div></div>
<table style="margin-top:10px"><tr><th>ID</th><th>ヘッダー画像</th><th>名前</th><th>${NEWB("新規","演出タイプ").replace('class="new"','class="new" style="margin:0;outline-offset:3px"')}</th><th>消費タイプ</th><th class="n">ポイント消費量</th><th>公開/非公開</th><th>目玉景品</th><th></th></tr>
${S.gachas.map(g=>`<tr style="background:#faf5ff"><td>${g.id}</td><td><span class="thumb"></span></td><td><a href="#edit/${g.id}" style="color:var(--blue2);font-weight:600">${g.name}</a></td><td><span class="badge p">TORAMI RUSH</span>${g.charge?' <span class="badge o">チャージ限定</span>':""}</td><td>${g.charge?"課金額消費":"ポイント"}</td><td class="n">${g.sell.length?fmt(Math.min(...g.sell))+"〜"+fmt(Math.max(...g.sell)):"—"}<div class="hint">${g.sell.length}レート</div></td><td>${sw(g.pub)}</td><td>${g.feat.filter(f=>f.stock>0).length}／${g.feat.length}種</td><td style="white-space:nowrap"><a class="btn blue sm" style="display:inline-flex;align-items:center;text-decoration:none" href="#edit/${g.id}">編集</a> ${playBtn(g.id,1)}</td></tr>`).join("")}
<tr><td>1072</td><td><span class="thumb"></span></td><td>gifテスト</td><td><span class="badge g">通常</span></td><td>ポイント</td><td class="n">10</td><td>${sw(1)}</td><td>—</td><td><button class="btn blue sm">編集</button></td></tr>
<tr><td>1071</td><td><span class="thumb"></span></td><td>【テスト】ラスワン確認_削除可</td><td><span class="badge g">通常</span></td><td>ポイント</td><td class="n">10</td><td>${sw(1)}</td><td>—</td><td><button class="btn blue sm">編集</button></td></tr></table>
<p class="desc" style="margin-top:8px">「新規作成（TORAMI RUSH）」でRUSHのオリパを作り、「プロトで遊ぶ」でその設定のまま遊べます（下の2行は既存の通常オリパの例）。</p>`}
/* ---------- オリパ編集（RUSH） ---------- */
let EDIT=null; // 編集中のコピー
function pEdit(id){const g0=G(id)||S.gachas[0];if(!EDIT||String(EDIT.id)!==String(g0.id))EDIT=JSON.parse(JSON.stringify(g0));const g=EDIT;const sel=ALLR.filter(r=>g.sell.includes(r));
return`<div class="bc">オリパ<span>/</span>一覧<span>/</span>編集</div><h1><a class="bk" href="#list" style="text-decoration:none">←</a>オリパ編集 <span class="hint" style="font-weight:400">ID ${g.id}</span></h1>
${NEWB("新規：演出タイプ",`<label class="l" style="margin-top:0">演出タイプ</label><select style="max-width:420px" disabled><option>TORAMI RUSH（倍率BOX）</option></select><div class="hint">TORAMI RUSHにすると、景品登録とガチャボタンの欄が「RUSH設定」に切り替わります。公開後は変更できません</div>`)}
<label class="l">オリパ名</label><input id="gName" value="${g.name.replace(/"/g,"&quot;")}">
<label class="l">カテゴリ名</label><select><option>ホビー</option><option>ポケモン</option></select>
<label class="l">ヘッダー画像名</label><input type="file" style="padding-top:4px">
<label class="l">消費タイプ</label><select id="gCharge"><option value="0" ${g.charge?"":"selected"}>ポイント</option><option value="1" ${g.charge?"selected":""}>課金額消費（チャージ限定・挑戦枠）</option></select>
${HIDE(`<label class="l">ポイント消費量</label><input value="10" disabled>`)}
<label class="l">ガチャ条件</label><select><option>条件無し</option><option>1日1回</option></select>
<label class="l">ユーザー条件</label><select><option>条件無し</option></select>
<div class="row" style="margin-top:14px">ユーザーランクを限定 ${sw(0)}</div>
<div class="row">宝箱ゲージ対象 ${sw(1)} <span class="hint">OFFにすると、このオリパのコイン消費がゲージ進捗に含まれません</span></div>
${HIDE(`<div class="row">残数表示（総口・残数・ゲージ） ${sw(0)} <span class="hint">RUSHは常にOFF（BOXの残り状況は出さない・表示B案）</span></div>`)}
<label class="l">公開/非公開</label><span class="sw ${g.pub?"on":""}" id="gPub"></span>
${HIDE(`<label class="l">ガチャボタンの有効化</label><div class="row">1回 ${sw(1)} 10連 ${sw(1)} 100連 ${sw(1)} 1000連 ${sw(0)} 全部ガチャる ${sw(0)}</div>`)}
<label class="l">公開予定日</label><input type="datetime-local" value="2026-12-15T12:00" style="max-width:240px">
${HIDE(`<h2 style="margin-top:20px">景品</h2><p class="desc">ランクごとに景品を設定出来ます。「S」〜「その他」… → RUSHでは使わない（BOXの中身は倍率の口。払い出しは目玉景品 → PSA景品マスタ）</p>`)}
${NEWB("新規：RUSH設定",`<h2 style="margin-top:0">RUSH設定</h2><p class="desc">販売するレートにチェックするだけ。レートごとのBOX（倍率の口）は「TORAMI RUSH ＞ 倍率の表・レート帯」の設定で自動生成され、完売すると同じ表で自動的に再販されます。</p>
<label class="l">販売するレート（1回の購入ポイント）</label>
<div class="rates" id="rates">${ALLR.map(r=>`<label><input type="checkbox" data-r="${r}" ${g.sell.includes(r)?"checked":""}> ${fmt(r)} <span class="hint">${tname(tk(r)).split("・")[1]}</span></label>`).join("")}</div>
<div class="grid2" style="margin-top:12px"><div><label class="l">演出セット</label><select><option>虎巻ATTACK 通常</option></select></div><div><label class="l">シナリオの出やすさ</label><select><option>シナリオマスタの設定を使う</option></select></div></div>
<div class="alert p">保存時の自動チェック：${sel.length?`販売レートの還元率 <b>${[...new Set(sel.map(tk))].map(k=>(st(rowsOf(k)).ret*100).toFixed(1)+"%").join("／")}</b>・最低3連・最大${mt(Math.max(...sel.map(r=>st(rowsOf(tk(r))).max)))} <span class="ok">OK</span>`:'<span class="ng">販売するレートを1つ以上選んでください</span>'}</div>`)}
${NEWB("新規：目玉景品（任意）",`<h3 style="margin-top:0">目玉景品</h3><p class="desc">カードデータベースから選んで、交換ポイント（PT）と個数を登録するだけ。SCOREがこのPTと同じになったときに優先して払い出し、個数が0になったら（弾切れ）PSA景品マスタから払い出します。PTが販売中のどのレート×倍率にもならない場合は出ないため、警告します。</p>
<table><tr><th>カード</th><th>状態</th><th class="n">交換ポイント</th><th class="n">個数</th><th>出る組み合わせ（自動）</th><th>カード表示</th><th></th></tr>
${g.feat.map((f,i)=>{const c=combos(f.pt,g);return`<tr><td><b>${f.card}</b></td><td>${f.cond}</td><td class="n">${fmt(f.pt)}</td><td class="n"><input class="s" type="number" min="0" value="${f.stock}" data-fq="${i}" style="width:70px;min-width:0"></td><td>${c.length?c.map(x=>`${man(x.r)}×${Math.round(x.m*10)/10}`).join("、"):'<span class="ng">なし（出ません）</span>'}${f.stock<=0?'<div class="warn">弾切れ → PSA景品マスタ</div>':""}</td><td>${sw(1)}</td><td><button class="btn gray sm" data-fd="${i}">削除</button></td></tr>`}).join("")}
<tr><td class="ac" style="width:240px"><input class="s" id="fCard" placeholder="カード名を入力" style="width:100%" autocomplete="off"><div class="acl" id="fAc" style="display:none"></div></td><td><select class="s" id="fCond"><option>PSA10</option><option>普通</option><option>未開封</option><option>CGS</option></select></td><td class="n"><input class="s" id="fPt" type="number" step="500" value="25000" style="width:110px"></td><td class="n"><input class="s" id="fQty" type="number" value="1" min="1" style="width:70px;min-width:0"></td><td id="fHint" class="hint"></td><td></td><td><button class="btn sm" id="fAdd">追加</button></td></tr></table>`)}
<div class="row" style="margin-top:22px"><button class="btn" id="gSave">保存</button>${playBtn(g.id)}<span class="hint">保存すると、プロト（別タブ）にもすぐ反映されます</span></div>`}
/* ---------- 倍率の表・レート帯 ---------- */
let EK="t1000",ED=null;
function pTables(){if(!ED)ED=rowsOf(EK).map(r=>[...r]);const s=st(ED);const ck=[["還元率",(s.ret*100).toFixed(1)+"%",s.ret>=.95&&s.ret<=.99,"95〜99%"],["白7率（×1以上）",(s.w7*100).toFixed(0)+"%",s.w7>=.3,"30%以上"],["一番下の口",mt(s.min),s.min>=.3,"×0.3以上＝最低3連"],["一番上の口",mt(s.max),s.max<=30,"×30以下＝20ゲーム以内"],["0.1刻み",s.step?"OK":"NG",s.step,"上乗せ・端数を出さない"],["持ち出しの理論上限",fmt(s.ceil)+"口",true,"×1を超える口が全部先に出た場合"]];
return`<div class="bc">TORAMI RUSH<span>/</span>倍率の表・レート帯</div><h1>倍率の表・レート帯 <span class="badge p">全オリパ共通</span></h1>
<div class="alert o">変更は販売中のBOXには反映されません。各レートのBOXが完売して次の周を作るときから新しい表になります。</div>
<h2>レート帯</h2><p class="desc">レートの範囲ごとに使う倍率の表を決めます。</p>
<table style="max-width:820px"><tr><th>レート帯</th><th>使う表</th><th class="n">還元率</th><th class="n">白7率</th><th class="n">最大倍率</th></tr>${S.bands.map((b,i)=>{const lo=i?S.bands[i-1].max:0,s2=st(rowsOf(b.t));return`<tr><td>${i?man(lo)+"超":"500"} 〜 ${b.max==null?"100万":`<select class="s" data-cut="${i}">${[30000,50000,100000,200000,300000,500000,750000].filter(c=>c>lo&&(i+1>=S.bands.length||c<bandMax(S.bands[i+1]))).map(c=>`<option value="${c}" ${c===b.max?"selected":""}>${man(c)}</option>`).join("")}</select>`}</td><td>${tname(b.t)}</td><td class="n">${(s2.ret*100).toFixed(1)}%</td><td class="n">${(s2.w7*100).toFixed(0)}%</td><td class="n">${mt(s2.max)}</td></tr>`}).join("")}</table>
<h2>倍率の表</h2><div class="row"><select class="s" id="edSel">${TK.map(k=>`<option value="${k}" ${k===EK?"selected":""}>${tname(k)}</option>`).join("")}</select></div>
<div class="grid2"><table><tr><th>倍率</th><th class="n">口数</th><th class="n">確率</th><th class="n">SCORE（5,000の例）</th></tr>${ED.map(([m,c],i)=>`<tr><td>${mt(m)}</td><td class="n"><input class="s" type="number" min="0" value="${c}" data-ed="${i}" style="width:90px"></td><td class="n">${(c/Math.max(1,s.N)*100).toFixed(1)}%</td><td class="n">${fmt(m*5000)}</td></tr>`).join("")}<tr><td><b>合計</b></td><td class="n"><b>${fmt(s.N)}口</b></td><td></td><td></td></tr></table>
<table><tr><th>自動チェック</th><th class="n">値</th><th>判定</th></tr>${ck.map(c=>`<tr><td>${c[0]}<div class="hint">${c[3]}</div></td><td class="n">${c[1]}</td><td>${c[2]?'<span class="ok">OK</span>':'<span class="ng">NG</span>'}</td></tr>`).join("")}</table></div>
<div class="row" style="margin-top:14px"><button class="btn" id="edSave" ${ck.every(c=>c[2])?"":"disabled"}>保存（次の周から反映）</button><button class="btn gray" id="edReset">元に戻す</button></div>`}
/* ---------- PSA景品マスタ ---------- */
function pPsa(){return`<div class="bc">TORAMI RUSH<span>/</span>PSA景品マスタ</div><h1>PSA景品マスタ <span class="badge p">全オリパ共通</span></h1>
<p class="desc">SCOREと同じPTのPSA景品を価格帯ごとに管理します。払い出しの順番は「目玉景品（オリパごと）→ PSA景品 → 代替景品 → ポイントのみ（発送不可）」。在庫が通知のしきい値以下になると通知します。プロトで「発送する」を選ぶと在庫が減ります。</p>
<table><tr><th>価格帯（SCORE）</th><th>PSA景品（表示名）</th><th class="n">PSA在庫</th><th class="n">代替景品 在庫</th><th class="n">通知（以下）</th><th>状態</th></tr>
${S.tiers.map((t,i)=>`<tr><td>${man(t.v)} 〜</td><td><input class="s" value="${t.card||""}" data-ts="${i}" data-f="card" style="width:240px"></td><td class="n"><input class="s" type="number" min="0" value="${t.stock}" data-ts="${i}" data-f="stock" style="width:80px;min-width:0"></td><td class="n"><input class="s" type="number" min="0" value="${t.alt}" data-ts="${i}" data-f="alt" style="width:80px;min-width:0"></td><td class="n">${t.warn}</td><td>${t.stock<=0&&t.alt<=0?'<span class="badge r">ポイントのみ</span>':t.stock<=0?'<span class="badge o">代替で払い出し</span>':t.stock<=t.warn?'<span class="badge o">残りわずか</span>':'<span class="badge">OK</span>'}</td></tr>`).join("")}</table>
<div class="row" style="margin-top:14px"><button class="btn" id="psaSave">保存</button></div>`}
/* ---------- BOXモニター ---------- */
let MG=null;
function pMon(){if(!MG||!G(MG))MG=S.gachas[0].id;const g=G(MG);const rates=ALLR.filter(r=>g.sell.includes(r));
return`<div class="bc">TORAMI RUSH<span>/</span>BOXモニター</div><h1>BOXモニター <span class="badge g">閲覧のみ</span></h1>
<p class="desc">運営だけが見る画面です（ユーザーには出しません）。プロトで引いた結果がそのまま入ります。完売した周は必ず倍率の表どおりの還元率で着地し、同じ表で自動的に次の周が始まります。</p>
<div class="row"><select class="s" id="monSel">${S.gachas.map(x=>`<option value="${x.id}" ${String(x.id)===String(MG)?"selected":""}>${x.name}（${x.id}）</option>`).join("")}</select><span class="hint">持ち出しの通知：1周の売上の <input class="s" value="10" style="width:56px;min-width:0">% を超えたら Slack に通知</span><span style="margin-left:auto"></span>${playBtn(g.id,1)}<button class="btn gray sm" id="monReset">テスト用：このオリパのBOXと履歴を初期化</button></div>
<table style="margin-top:8px"><tr><th>レート</th><th>表</th><th class="n">周</th><th>売れた口</th><th class="n">この周の還元率</th><th>最上位の口</th><th class="n">この周の最大持ち出し</th><th class="n">完売した周</th></tr>
${rates.map(r=>{const b=S.boxes[g.id+":"+r];const done=S.rounds.filter(q=>String(q.gid)===String(g.id)&&q.r===r);const k=tk(r);
 if(!b)return`<tr><td><b>${fmt(r)}</b></td><td>${tname(k)}</td><td class="n">—</td><td class="hint">未販売</td><td class="n">—</td><td>—</td><td class="n">—</td><td class="n">0</td></tr>`;
 const N=b.items.length;return`<tr><td><b>${fmt(r)}</b></td><td>${fmt(N)}口・最大${mt(b.max/10)}</td><td class="n">第${b.round}周</td><td>${fmt(b.pos)}／${fmt(N)}口<div class="bar"><i style="width:${b.pos/N*100}%"></i></div></td><td class="n">${b.sold?(b.paid/b.sold*100).toFixed(1)+"%":"—"}</td><td>${b.topOut?'<span class="badge o">排出済み</span>':'<span class="badge g">残り</span>'}</td><td class="n">${fmt(b.worst/10)}口<div class="hint">${fmt(b.worst/10*r)}PT</div>${b.worst/10/N>.1?'<div class="warn">通知済み</div>':""}</td><td class="n">${done.length}${done.length?`<div class="hint">直近 ${(done[0].ret*100).toFixed(1)}%</div>`:""}</td></tr>`}).join("")}</table>
<p class="hint" style="margin-top:8px">本番は購入データから自動で集計。周の記録（周番号・開始/完売日時・売上・払い出し・最大持ち出し・口の並びのハッシュ）は削除不可で保存し、問い合わせや監査の根拠にする。プロトのテスト欄・「管理画面」タブの「100回売る」で売った分もここに入ります。</p>`}
/* ---------- 当選履歴 ---------- */
let HG="all";
function pHist(){const H=S.hist.filter(h=>HG==="all"||String(h.gid)===String(HG));const pl={feat:"目玉",psa:"PSA",alt:"代替",coin:"ポイント",ptonly:"ポイントのみ"};
return`<div class="bc">TORAMI RUSH<span>/</span>当選履歴</div><h1>当選履歴</h1><div class="row"><select class="s" id="hSel"><option value="all">全オリパ</option>${S.gachas.map(x=>`<option value="${x.id}" ${String(x.id)===String(HG)?"selected":""}>${x.name}</option>`).join("")}</select><input class="s" placeholder="ユーザーID" style="width:180px"><button class="btn gray sm">CSV出力</button><span class="hint">プロトで引いた結果が入ります（最新300件）</span></div>
<table style="margin-top:8px"><tr><th>日時</th><th>オリパ</th><th class="n">レート</th><th>BOX</th><th class="n">倍率</th><th class="n">SCORE</th><th>演出</th><th>払い出し</th><th>受け取り</th></tr>
${H.length?H.map(h=>{const g=G(h.gid);return`<tr><td>${new Date(h.at).toLocaleString("ja-JP")}</td><td>${g?g.name:h.gid}</td><td class="n">${fmt(h.r)}</td><td>第${h.round}周 ${fmt(h.no)}／${fmt(h.N)}口目</td><td class="n">${mt(h.u/10)}</td><td class="n">${fmt(h.score)}</td><td>${h.scn}・${h.G}連</td><td><span class="badge ${h.po==="feat"?"p":h.po==="psa"?"":"g"}">${pl[h.po]||h.po}</span> ${h.pname||""}</td><td>${h.recv==="発送"?'<span class="badge">発送</span>':`<span class="badge g">${h.recv}</span>`}</td></tr>`}).join(""):`<tr><td colspan="9" class="hint">まだありません。オリパ一覧の「プロトで遊ぶ」から引くと、ここに入ります</td></tr>`}</table>
<p class="hint" style="margin-top:8px">発送を選んだものは既存の「配送」メニューに流れる想定。演出（7の並び・シナリオ）も保存するので、問い合わせ時に同じ演出を再生できる。</p>`}
/* ---------- シナリオ ---------- */
const SN=[["白7多めで長く続く","8〜12","白7が多めに出て長く続く"],["後半爆発","6〜10","前半は紫7シングル中心、後半に白7・白7ダブル"],["序盤ダブル連発","5〜8","序盤に紫7ダブル・白7ダブルが続く"],["紫7コツコツ","8〜12","紫7シングル中心で少しずつ積む"],["序盤に白7ダブル","4〜6","最初の数ゲームで白7ダブル、そのあと紫7"],["最後に白7ダブル","4〜7","最後のゲームで白7ダブル"],["じわじわ加速","6〜10","紫7から白7へ少しずつ移る"],["紫→白の昇格","5〜8","前半は紫7、後半は白7"],["紫と白が交互","6〜10","紫7と白7が1ゲームごとに入れ替わる"],["短く決着","3〜5","短く決着"]];
function pScn(){return`<div class="bc">TORAMI RUSH<span>/</span>シナリオ</div><h1>シナリオ <span class="badge p">全オリパ共通</span></h1><p class="desc">7の出方のパターン。ゲーム数は倍率に合わせて自動調整（最低3・最大20）。7の合計は必ず倍率ちょうど（上乗せなし）。結果（倍率・SCORE・景品）には影響しません。出やすさを0にするとそのシナリオは出ません。</p>
<table><tr><th>#</th><th>シナリオ名</th><th>ゲーム数</th><th>7の出方</th><th class="n">出やすさ</th></tr>${SN.map((s,i)=>`<tr><td>${i+1}</td><td><b>${s[0]}</b></td><td>${s[1]}</td><td>${s[2]}</td><td class="n"><input class="s" type="number" min="0" value="${S.scnw[i]}" data-sw="${i}" style="width:70px;min-width:0"></td></tr>`).join("")}</table><div class="row" style="margin-top:14px"><button class="btn" id="scnSave">保存</button></div>`}
/* ---------- 表示設定 ---------- */
function pDisp(){return`<div class="bc">TORAMI RUSH<span>/</span>表示設定</div><h1>表示設定 <span class="badge p">全オリパ共通</span></h1>
<label class="l">注意書き（購入ボタンの近くと遊び方に表示）</label><textarea rows="4" id="nTxt">${S.notice}</textarea>
<div class="hint">文言は弁護士の確認後に確定。小さく書くだけでは打消し表示として無効とされやすいため、購入ボタンの近くに出す</div>
<div class="grid2"><div><label class="l">還元率の表示（最大倍率・倍率の表は非公開）</label><select disabled><option>倍率の表から自動計算（例：97.5%）</option></select></div><div><label class="l">BOXの残り状況（残り口数・残り倍率・残り還元率）</label><select disabled><option>表示しない（固定）</option></select></div>
<div><label class="l">実績還元率の公開</label><select><option>全レート合算・直近30日</option><option>全レート合算・直近1週間</option></select></div><div><label class="l">当たり速報</label><select><option>×5以上を表示</option><option>×10以上を表示</option><option>表示しない</option></select></div></div>
<div class="row" style="margin-top:18px"><button class="btn" id="dSave">保存</button><span style="margin-left:auto"></span><button class="btn gray sm" id="allReset">テスト用：すべての設定・BOX・履歴を初期状態に戻す</button></div>`}
/* ---------- ルーター ---------- */
const P={list:pList,edit:pEdit,tables:pTables,psa:pPsa,monitor:pMon,hist:pHist,scn:pScn,disp:pDisp};
function cur(){const [p,a]=(location.hash.slice(1)||"list").split("/");return{p:P[p]?p:"list",a}}
function go(h){location.hash=h}
function render(){const {p,a}=cur();$("pg").innerHTML=P[p](a);document.querySelectorAll(".side a").forEach(x=>x.classList.toggle("act",x.dataset.p===p||(p==="edit"&&x.dataset.p==="list")));bind(p,a)}
window.addEventListener("hashchange",()=>{render();scrollTo(0,0)});
$("side").addEventListener("click",e=>{const x=e.target.closest("a[data-p]");if(x)go(x.dataset.p)});
// プロト（別タブ）で引いたら、一覧・BOXモニター・当選履歴・PSA在庫を更新
addEventListener("storage",e=>{if(e.key!==RS.LS)return;S=RS.load();const {p}=cur();if(["list","monitor","hist","psa"].includes(p))render()});
function bind(p,a){
 if(p==="list")$("newRush").onclick=()=>{const id=Math.max(1074,...S.gachas.map(g=>g.id))+1;S.gachas.unshift({id,name:"TORAMI RUSH 新規"+id,charge:false,pub:false,sell:ALLR.slice(),feat:[]});save("TORAMI RUSHのオリパを作成しました（ID "+id+"）");EDIT=null;go("edit/"+id)};
 if(p==="edit"){const g=EDIT;
  $("gName").oninput=e=>g.name=e.target.value;
  $("gCharge").onchange=e=>{g.charge=e.target.value==="1";if(g.charge&&!g.sell.includes(5000))g.sell=[5000];render()};
  $("gPub").onclick=()=>{g.pub=!g.pub;$("gPub").classList.toggle("on",g.pub)};
  $("rates").onchange=e=>{const r=+e.target.dataset.r;if(e.target.checked){if(!g.sell.includes(r))g.sell.push(r)}else g.sell=g.sell.filter(x=>x!==r);g.sell.sort((x,y)=>x-y);render()};
  document.querySelectorAll("[data-fq]").forEach(x=>x.onchange=()=>{g.feat[+x.dataset.fq].stock=Math.max(0,+x.value);render()});
  document.querySelectorAll("[data-fd]").forEach(x=>x.onclick=()=>{g.feat.splice(+x.dataset.fd,1);render()});
  const hint=()=>{const c=combos(+$("fPt").value||0,g);$("fHint").innerHTML=c.length?"出る組み合わせ："+c.map(x=>`${man(x.r)}×${Math.round(x.m*10)/10}`).join("、"):'<span class="ng">どのレート×倍率にもならないため出ません</span>'};
  $("fPt").oninput=hint;hint();
  $("fCard").oninput=()=>{const q=$("fCard").value.trim();const m=CARDS.filter(c=>q&&c.toLowerCase().includes(q.toLowerCase()));$("fAc").style.display=m.length?"block":"none";$("fAc").innerHTML=m.map(c=>`<div>${c}</div>`).join("")};
  $("fAc").onclick=e=>{$("fCard").value=e.target.textContent;$("fAc").style.display="none"};
  $("fAdd").onclick=()=>{const card=$("fCard").value.trim();if(!card)return;const cond=$("fCond").value;g.feat.push({card,cond,name:card+" "+cond,pt:+$("fPt").value,stock:Math.max(1,+$("fQty").value)});g.feat.sort((x,y)=>y.pt-x.pt);render()};
  $("gSave").onclick=()=>{if(!g.sell.length){toast("販売するレートを1つ以上選んでください");return}const i=S.gachas.findIndex(x=>String(x.id)===String(g.id));S.gachas[i]=JSON.parse(JSON.stringify(g));save("保存しました",g.id)}}
 if(p==="tables"){$("edSel").onchange=e=>{EK=e.target.value;ED=null;render()};
  document.querySelectorAll("[data-ed]").forEach(x=>x.onchange=()=>{ED[+x.dataset.ed][1]=Math.max(0,Math.round(+x.value||0));render()});
  document.querySelectorAll("[data-cut]").forEach(x=>x.onchange=()=>{S.bands[+x.dataset.cut].max=+x.value;save("レート帯を保存しました（次の周から反映）");render()});
  $("edSave").onclick=()=>{S.tables[EK]=ED.map(r=>[...r]);save("倍率の表を保存しました（次の周から反映）");render()};$("edReset").onclick=()=>{ED=null;render()}}
 if(p==="psa"){document.querySelectorAll("[data-ts]").forEach(x=>x.onchange=()=>{const t=S.tiers[+x.dataset.ts];t[x.dataset.f]=x.dataset.f==="card"?x.value:Math.max(0,+x.value)});$("psaSave").onclick=()=>{save("PSA景品マスタを保存しました");render()}}
 if(p==="monitor"){$("monSel").onchange=e=>{MG=e.target.value;render()};$("monReset").onclick=()=>{const id=String(MG);Object.keys(S.boxes).forEach(k=>{if(k.startsWith(id+":"))delete S.boxes[k]});S.rounds=S.rounds.filter(q=>String(q.gid)!==id);S.hist=S.hist.filter(h=>String(h.gid)!==id);delete S.acc[id];save("BOXと履歴を初期化しました");render()}}
 if(p==="hist")$("hSel").onchange=e=>{HG=e.target.value;render()};
 if(p==="scn"){document.querySelectorAll("[data-sw]").forEach(x=>x.onchange=()=>{S.scnw[+x.dataset.sw]=Math.max(0,+x.value||0)});$("scnSave").onclick=()=>{if(!S.scnw.some(v=>v>0)){toast("どれか1つは1以上にしてください");return}save("シナリオを保存しました")}}
 if(p==="disp"){$("dSave").onclick=()=>{S.notice=$("nTxt").value;save("表示設定を保存しました")};$("allReset").onclick=()=>{RS.reset();S=RS.load();RS.save(S);EDIT=null;toast("初期状態に戻しました");render()}}
}
render();
</script></body></html>
